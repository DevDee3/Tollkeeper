name: contract

# Checks the policy contract and builds the deployable .wasm in the cloud,
# so nothing needs to be installed locally. Download the result from the
# run's "Artifacts" section.
#
# Tollkeeper in its own repo:      leave PROJECT_DIR as ".".
# Tollkeeper inside another repo:  copy this file to that repo's
#                                  .github/workflows/ and set PROJECT_DIR to the
#                                  folder that holds Cargo.toml (e.g. "tollkeeper").

env:
  PROJECT_DIR: .

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # cargo-near pulls in a USB library (hidapi, used for Ledger signing) that
      # needs these system packages to compile. Without them its install fails.
      - name: System packages for cargo-near
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR }}

      # The two tools below take minutes to compile, so keep them between runs.
      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-near
            ~/.cargo/bin/cargo-audit
          key: cargo-tools-${{ runner.os }}-v1

      - name: Format
        run: cargo fmt --check
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Tests
        run: cargo test
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Dependency audit
        run: |
          command -v cargo-audit || cargo install cargo-audit --locked
          cargo audit
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build wasm
        run: |
          command -v cargo-near || cargo install cargo-near --locked
          cargo near build non-reproducible-wasm
        working-directory: ${{ env.PROJECT_DIR }}/contracts/policy

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: tollkeeper-policy-wasm
          path: "**/target/near/**/*.wasm"
          if-no-files-found: error
